name: Run Movie SQL Analysis

on:
  workflow_dispatch:
  push:
    paths:
      - "Movies_Data_Analytics_Project.xlsx"
      - "sql/**"
      - "scripts/run_sql_analysis.py"
      - ".github/workflows/run-sql.yml"

permissions:
  contents: read

jobs:
  run-sql:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas openpyxl

      - name: Import workbook data and execute SQL queries
        run: python scripts/run_sql_analysis.py

      - name: Upload SQLite database and query results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-sql-analysis-results
          path: |
            outputs/movie_analysis.sqlite
            outputs/sql_q*_results.csv
          if-no-files-found: warn
          retention-days: 14
